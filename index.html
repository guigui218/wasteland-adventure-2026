<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>废土余烬 - 生存冒险游戏</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- 主菜单 -->
        <div id="mainMenu" class="menu-screen active">
            <div class="menu-content">
                <h1 class="title">废土余烬</h1>
                <p class="subtitle">核弹浩劫过后，文明崩塌。辐射、强盗、变异生物横行废土。<br>你是一名幸存者，在锈水镇开启生存冒险。</p>
                <p class="description">包含完整六章剧情，多重分支永久后果，<br>战斗、伙伴、避难所建设、好感约会系统。</p>
                <button class="btn btn-primary" onclick="startGame()">▶ 开始冒险</button>
            </div>
        </div>

        <!-- 游戏界面 -->
        <div id="gameScreen" class="game-screen">
            <!-- 顶部导航栏 -->
            <nav class="navbar">
                <div class="nav-left">
                    <h2 id="chapterTitle">第一章：苏醒</h2>
                </div>
                <div class="nav-right">
                    <button class="nav-btn" onclick="toggleStory()">📖剧情</button>
                    <button class="nav-btn" onclick="toggleStats()">📊状态</button>
                    <button class="nav-btn" onclick="toggleInventory()">🎒背包</button>
                    <button class="nav-btn" onclick="toggleSave()">💾保存</button>
                </div>
            </nav>

            <!-- 左侧状态栏 -->
            <div class="sidebar stats-panel" id="statsPanel">
                <h3>生存指数</h3>
                <div class="stat-item">
                    <label>生命</label>
                    <div class="stat-bar">
                        <div class="stat-fill" id="hpFill" style="width: 100%"></div>
                    </div>
                    <span id="hpValue">100/100</span>
                </div>
                <div class="stat-item">
                    <label>饱食</label>
                    <div class="stat-bar">
                        <div class="stat-fill" id="hungerFill" style="width: 100%"></div>
                    </div>
                    <span id="hungerValue">100/100</span>
                </div>
                <div class="stat-item">
                    <label>口渴</label>
                    <div class="stat-bar">
                        <div class="stat-fill" id="thirstFill" style="width: 100%"></div>
                    </div>
                    <span id="thirstValue">100/100</span>
                </div>
                <div class="stat-item">
                    <label>辐射</label>
                    <div class="stat-bar">
                        <div class="stat-fill danger" id="radiationFill" style="width: 0%"></div>
                    </div>
                    <span id="radiationValue">0/100</span>
                </div>
                <div class="stat-item">
                    <label>瓶盖(货币)</label>
                    <span id="capsValue" class="caps">50</span>
                </div>
            </div>

            <!-- 中心内容区域 -->
            <div class="main-content">
                <div class="story-panel" id="storyPanel">
                    <div class="story-text" id="storyText">
                        <!-- 故事内容动态加载 -->
                    </div>
                    <div class="choices" id="choicesContainer">
                        <!-- 选择按钮动态加载 -->
                    </div>
                </div>

                <!-- 背包面板 -->
                <div class="inventory-panel" id="inventoryPanel" style="display: none;">
                    <h3>背包</h3>
                    <div class="inventory-grid" id="inventoryGrid">
                        <!-- 物品动态加载 -->
                    </div>
                </div>

                <!-- 保存/读取面板 -->
                <div class="save-panel" id="savePanel" style="display: none;">
                    <h3>游戏存档</h3>
                    <div class="save-buttons">
                        <button class="btn" onclick="saveGame()">💾 保存游戏</button>
                        <button class="btn" onclick="loadGame()">📂 读取游戏</button>
                        <button class="btn" onclick="resetGame()">🔄 新游戏</button>
                    </div>
                    <div class="save-list" id="saveList">
                        <!-- 存档列表动态加载 -->
                    </div>
                </div>
            </div>

            <!-- 右侧信息栏 -->
            <div class="sidebar info-panel" id="infoPanel">
                <h3>信息</h3>
                <div id="infoContent">
                    <p>欢迎来到废土！选择你的下一步行动。</p>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
