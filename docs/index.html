<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>荒原冒险 2026 - Wasteland Adventure</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="game-header">
            <h1>荒原冒险 2026</h1>
            <p class="subtitle">Wasteland Adventure 2026</p>
            <p class="description">一个基于文本的废土生存冒险游戏</p>
        </div>

        <div class="game-area">
            <div class="story-display">
                <div id="current-scene">准备进入荒原...</div>
                <div id="scene-description"></div>
            </div>

            <div class="game-controls">
                <div id="choices-container" class="choices-container"></div>
                
                <div class="input-area">
                    <input type="text" id="command-input" placeholder="输入命令或选择数字..." />
                    <button id="submit-btn" onclick="submitCommand()">执行</button>
                </div>

                <div class="stats-bar">
                    <div class="stat">
                        <span class="stat-label">生命值:</span>
                        <div class="stat-bar-inner">
                            <div id="health-bar" class="stat-value" style="width: 100%"></div>
                        </div>
                        <span id="health-text">100/100</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">饥饿值:</span>
                        <div class="stat-bar-inner">
                            <div id="hunger-bar" class="stat-value" style="width: 50%"></div>
                        </div>
                        <span id="hunger-text">50/100</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">精力:</span>
                        <div class="stat-bar-inner">
                            <div id="energy-bar" class="stat-value" style="width: 75%"></div>
                        </div>
                        <span id="energy-text">75/100</span>
                    </div>
                </div>

                <div class="inventory-section">
                    <h3>背包</h3>
                    <div id="inventory" class="inventory-list"></div>
                </div>

                <div class="button-group">
                    <button onclick="newGame()">新游戏</button>
                    <button onclick="saveGame()">保存</button>
                    <button onclick="loadGame()">读取</button>
                    <button onclick="toggleHelp()">帮助</button>
                </div>
            </div>
        </div>

        <div id="help-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close" onclick="toggleHelp()">&times;</span>
                <h2>游戏帮助</h2>
                <h3>基本命令:</h3>
                <ul>
                    <li><strong>move/go [方向]</strong> - 向某个方向移动</li>
                    <li><strong>look/examine</strong> - 查看当前场景</li>
                    <li><strong>inventory/inv</strong> - 查看背包</li>
                    <li><strong>status/stats</strong> - 查看角色状态</li>
                    <li><strong>help</strong> - 显示帮助</li>
                </ul>
                <h3>游戏背景:</h3>
                <p>在2026年的核战争后，地球变成了一片荒原。你是一个幸存者，需要生存。</p>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
